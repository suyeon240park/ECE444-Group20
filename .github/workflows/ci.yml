name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  client:
    name: Client (typecheck + web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  # Staging (#22): after both jobs pass on main, tell Render to deploy exactly this
  # commit. The two deploy-hook URLs are repository secrets; see docs/deployment.md.
  deploy-staging:
    name: Deploy staging
    needs: [backend, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploys
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          CLIENT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
        run: |
          if [ -z "$BACKEND_HOOK" ] || [ -z "$CLIENT_HOOK" ]; then
            echo "::warning::Render deploy hooks are not configured; staging was not deployed."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$BACKEND_HOOK&ref=$GITHUB_SHA" > /dev/null
          curl --fail --silent --show-error -X POST "$CLIENT_HOOK&ref=$GITHUB_SHA" > /dev/null
          echo "Requested staging deploys of $GITHUB_SHA"
