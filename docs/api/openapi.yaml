openapi: 3.1.0
info:
  title: What's in My Food? — Product API
  version: 0.1.0
  description: |
    Contract for product data returned by the backend (#20). Read `README.md` in
    this folder for the rules behind these shapes: how missing data is represented,
    sources and certainty, nutrition basis, and when a result is complete.

    Every property is always present. Missing data is `null`, never `0` or `""`.
    The Python implementation is `backend/app/models/product.py`, and
    `backend/tests/test_contract_examples.py` checks that the examples below match it.
servers:
  - url: /
    description: The backend itself (http://localhost:5000 in local development)
# The API has no authentication.
security: []

paths:
  /api/products/{barcode}:
    get:
      operationId: getProductByBarcode
      summary: Look up a packaged food by barcode
      description: |
        Looks the barcode up in Open Food Facts and returns it in the application's
        product model. Implemented by #14.
      parameters:
        - name: barcode
          in: path
          required: true
          description: EAN-8, UPC-A, EAN-13 or GTIN-14, digits only.
          schema:
            type: string
            pattern: "^\\d{8,14}$"
          example: "3017624010701"
      responses:
        "200":
          description: |
            Product found. `completeness` says whether it has everything a full
            analysis needs; `missing_fields` lists what is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResult"
              examples:
                complete:
                  $ref: "#/components/examples/productComplete"
                incomplete:
                  $ref: "#/components/examples/productIncomplete"
                nutritionOnly:
                  $ref: "#/components/examples/nutritionOnly"
        "400":
          description: The barcode is not 8 to 14 digits. No lookup was attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidBarcode:
                  $ref: "#/components/examples/errorInvalidBarcode"
        "404":
          description: |
            The product database has no usable record for this barcode. This is a
            successful lookup with a negative answer, not a failure. The client
            should offer the Nutrition Facts photo fallback (F1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  $ref: "#/components/examples/errorProductNotFound"
        "502":
          description: |
            The product database failed or returned something unusable (server
            error, rate limit, non-JSON body). Whether the product exists is unknown;
            the client may retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unavailable:
                  $ref: "#/components/examples/errorUpstreamUnavailable"
        "504":
          description: |
            The product database did not answer in time. Returned within Q2's
            10-second limit. Whether the product exists is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                timeout:
                  $ref: "#/components/examples/errorUpstreamTimeout"

  /api/nutrition-label:
    post:
      operationId: readNutritionLabel
      summary: Read a Nutrition Facts photo
      description: |
        Reads the Nutrition Facts table in a photo with the vision model and returns
        a `nutrition_only` result: serving, servings per package and nutrients, with
        no name, brand or ingredients. Implemented by #42.

        Every value comes back `uncertain`: the model gives no per-value confidence,
        so by Q1's safe-use rule nothing is used until the user confirms it (the
        client then marks it `user_confirmed`). An unconfirmed serving size is listed
        in `missing_fields`, so a fresh reading is always `incomplete`.

        The photo is validated like `/api/barcode` (JPEG, PNG or WEBP; 10 MB; pixel
        limit), turned upright from EXIF, and shrunk to 2000 px on its long edge
        before it is sent to the model.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo of the Nutrition Facts table.
      responses:
        "200":
          description: The table was read. Values are `uncertain` until confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResult"
        "400":
          description: No `image` field (`missing_image`) or the file is not a readable image (`invalid_image`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "413":
          description: The upload is over 10 MB (`file_too_large`) or has too many pixels (`image_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "415":
          description: The file is an image type other than JPEG, PNG or WEBP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "422":
          description: |
            No Nutrition Facts table was found, or it was too blurred to read. The
            client should ask for a retake.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "502":
          description: The vision model failed or returned an unusable reply. The client may retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "503":
          description: Photo reading is not configured on this server (no `GEMINI_API_KEY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "504":
          description: The vision model did not answer in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"

  /api/analysis/{barcode}:
    get:
      operationId: analyzeBarcode
      summary: Analyze a packaged food identified by barcode
      description: |
        The product-analysis pipeline (#43): looks the barcode up like
        `GET /api/products/{barcode}` and adds every section the results page
        (#41) shows. Read `analysis.md` in this folder for the rules.
      parameters:
        - name: barcode
          in: path
          required: true
          description: EAN-8, UPC-A, EAN-13 or GTIN-14, digits only.
          schema:
            type: string
            pattern: "^\\d{8,14}$"
      responses:
        "200":
          description: |
            Product found. `next_step` says whether to ask for a Nutrition Facts photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: The barcode is not 8 to 14 digits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No usable record for this barcode. The client offers the Nutrition Facts
            photo (`POST /api/analysis/label-photo`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The product database failed. Whether the product exists is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The product database did not answer in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/analysis/label-photo:
    post:
      operationId: analyzeLabelPhoto
      summary: Analyze a Nutrition Facts photo
      description: |
        Reads the photo like `POST /api/nutrition-label` and returns the same
        `AnalysisResult` as the barcode path. With a `barcode` the database finds,
        the label's values are merged into that product (`result: product`).
        Otherwise the result is `nutrition_only` and never claims a product was
        identified. Every photo value is `uncertain` until the user confirms it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo of the Nutrition Facts table.
                barcode:
                  type: string
                  description: The scanned barcode, when the product was not found or lacked nutrition.
      responses:
        "200":
          description: The table was read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: |
            `invalid_barcode` (checked before the photo is read), `missing_image` or
            `invalid_image`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PhotoError"
        "413":
          description: The upload is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "415":
          description: The file is not a JPEG, PNG or WEBP image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "422":
          description: No Nutrition Facts table was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "502":
          description: Every vision model failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "503":
          description: Photo reading is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"
        "504":
          description: The vision model did not answer in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoError"

  /api/analysis/confirm:
    post:
      operationId: confirmPhotoValues
      summary: Re-analyze a photo result after the user checked its values
      description: |
        The client shows the values from `POST /api/analysis/label-photo`, the user
        confirms or corrects them (#39, Q1), and the client sends the result back with
        each checked label-photo value's `certainty` set to `user_confirmed`. Values
        left `uncertain` are still not scaled or explained.

        Only label-photo values are read from the request. A `product` result is
        looked up again by its barcode, and every database value comes from that
        lookup, so a client cannot change or confirm database data. A photo serving
        replaces the database's serving and nutrition; without one, photo nutrients
        only fill the database's gaps. A `nutrition_only` result never claims a
        product, whatever the request says. See analysis.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationRequest"
      responses:
        "200":
          description: The result, re-analyzed with the confirmed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: |
            `invalid_confirmation` (not JSON, unknown `result`, a photo value with
            another certainty, a value the model rejects, or a photo value replacing a
            database value) or `invalid_barcode`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ConfirmationError"
        "404":
          description: A `product` result's barcode is no longer in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The database lookup timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    IngredientStatus:
      type: string
      enum:
      - unavailable
      - no_matches
      - analyzed
    IngredientAuthority:
      type: string
      enum:
      - health_canada
      - efsa
      - fda
      - who_jecfa
    IngredientFlagCategory:
      type: string
      enum:
      - authority_action
      - conflicting_assessments
    IngredientSourcedText:
      type: object
      additionalProperties: false
      required:
      - text
      - source_ids
      properties:
        text:
          type: string
          minLength: 1
        source_ids:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
    IngredientSource:
      type: object
      additionalProperties: false
      required:
      - id
      - publisher
      - title
      - url
      - published_on
      - accessed_on
      properties:
        id:
          type: string
          minLength: 1
        publisher:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        published_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        accessed_on:
          type: string
          format: date
    IngredientAuthorityPosition:
      type: object
      additionalProperties: false
      required:
      - id
      - authority
      - statement
      - scope
      - source_ids
      - assessed_on
      - effective_on
      properties:
        id:
          type: string
          minLength: 1
        authority:
          $ref: '#/components/schemas/IngredientAuthority'
        statement:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        source_ids:
          type: array
          items:
            type: string
          minItems: 1
        assessed_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        effective_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
    IngredientFlag:
      type: object
      additionalProperties: false
      required:
      - flag_reason
      - category
      - source_ids
      - position_ids
      properties:
        flag_reason:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/IngredientFlagCategory'
        source_ids:
          type: array
          items:
            type: string
          minItems: 1
        position_ids:
          type: array
          items:
            type: string
          minItems: 1
    IngredientEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - aliases
      - e_numbers
      - ins_numbers
      - what_it_is
      - why_used
      - explanation
      - sources
      - last_reviewed
      - authority_positions
      - flag
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
        e_numbers:
          type: array
          items:
            type: string
        ins_numbers:
          type: array
          items:
            type: string
        what_it_is:
          $ref: '#/components/schemas/IngredientSourcedText'
        why_used:
          $ref: '#/components/schemas/IngredientSourcedText'
        explanation:
          $ref: '#/components/schemas/IngredientSourcedText'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/IngredientSource'
          minItems: 1
        last_reviewed:
          type: string
          format: date
        authority_positions:
          type: array
          items:
            $ref: '#/components/schemas/IngredientAuthorityPosition'
        flag:
          anyOf:
          - $ref: '#/components/schemas/IngredientFlag'
          - type: 'null'
    IngredientOccurrence:
      type: object
      additionalProperties: false
      required:
      - text
      - path
      properties:
        text:
          type: string
          minLength: 1
        path:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 1
    MatchedIngredient:
      type: object
      additionalProperties: false
      required:
      - ingredient
      - occurrences
      properties:
        ingredient:
          $ref: '#/components/schemas/IngredientEntry'
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/IngredientOccurrence'
          minItems: 1
    UnmatchedIngredient:
      type: object
      additionalProperties: false
      required:
      - text
      - occurrences
      properties:
        text:
          type: string
          minLength: 1
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/IngredientOccurrence'
          minItems: 1
    IngredientWarning:
      type: object
      additionalProperties: false
      required:
      - code
      - text
      properties:
        code:
          type: string
          enum:
          - unbalanced_brackets
          - ambiguous_group
          - ambiguous_oil_component
          - nesting_limit
          - text_limit
          - ignored_preamble
          - no_ingredient_candidates
        text:
          type: string
          minLength: 1
    IngredientAnalysisResult:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_count
      - total_count
      - flagged_count
      - matched
      - unmatched
      - flagged_ids
      - warnings
      - message
      - coverage_text
      properties:
        status:
          $ref: '#/components/schemas/IngredientStatus'
        checked_count:
          type: integer
          minimum: 0
        total_count:
          type: integer
          minimum: 0
        flagged_count:
          type: integer
          minimum: 0
        matched:
          type: array
          items:
            $ref: '#/components/schemas/MatchedIngredient'
        unmatched:
          type: array
          items:
            $ref: '#/components/schemas/UnmatchedIngredient'
        flagged_ids:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/IngredientWarning'
        message:
          anyOf:
          - type: string
          - type: 'null'
        coverage_text:
          anyOf:
          - type: string
          - type: 'null'
          description: Null when unavailable or no ingredient candidates could be recovered.
      description: 'Reusable F4 service result for #40/#43. Not yet returned by GET /api/products/{barcode}.
        See ingredient-analysis.md and ingredient-examples.json. Counts deduplicate canonical matches
        and identical normalized unknowns. Warnings must accompany coverage. All flagged IDs are returned,
        without a three-item limit.'
    IngredientContentDocument:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - ingredient
      properties:
        schema_version:
          type: integer
          const: 1
        ingredient:
          $ref: '#/components/schemas/IngredientEntry'
    ProductResult:
      type: object
      additionalProperties: false
      required: [result, completeness, missing_fields, product]
      properties:
        result:
          type: string
          enum: [product, nutrition_only]
          description: |
            `product`: identified by barcode. `nutrition_only`: read from a Nutrition
            Facts photo without identifying the product (produced by #15). A
            nutrition-only result must be labelled "Nutrition-only result" (F1).
        completeness:
          type: string
          enum: [complete, incomplete]
          description: "`complete` exactly when `missing_fields` is empty."
        missing_fields:
          type: array
          description: |
            Dotted paths into `product` of required data that is missing or uncertain,
            e.g. `ingredients_text`, `serving.size_text`, `nutrition.basis`,
            `nutrition.nutrients.fibre`. Empty when complete.
          items:
            type: string
        product:
          $ref: "#/components/schemas/Product"

    Product:
      type: object
      additionalProperties: false
      required: [barcode, name, brand, ingredients_text, serving, package, nutrition, source]
      properties:
        barcode:
          type: [string, "null"]
          pattern: "^\\d{8,14}$"
          description: Canonical barcode as stored by the database. `null` for nutrition-only.
        name:
          type: [string, "null"]
          description: Product name. `null` if unknown and always `null` for nutrition-only.
        brand:
          type: [string, "null"]
          description: Brand(s) as listed by the database, e.g. `"Ferrero"`.
        ingredients_text:
          type: [string, "null"]
          description: |
            The ingredient list as printed. `null` means not available: show
            "Not available" and do not run ingredient analysis (F4).
        serving:
          $ref: "#/components/schemas/Serving"
        package:
          $ref: "#/components/schemas/Package"
        nutrition:
          $ref: "#/components/schemas/Nutrition"
        source:
          $ref: "#/components/schemas/DataSource"

    Serving:
      type: object
      additionalProperties: false
      required: [size_text, quantity, unit, source, certainty]
      properties:
        size_text:
          type: [string, "null"]
          description: Serving size as printed, e.g. `"6 crackers (30 g)"`.
        quantity:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Metric serving quantity, e.g. `30`.
        unit:
          type: [string, "null"]
          enum: [g, ml, null]
        source:
          $ref: "#/components/schemas/SourceOrNull"
        certainty:
          type: [string, "null"]
          enum: [reported, confident, uncertain, user_confirmed, null]
          description: |
            Q1 critical field. `reported` for database values. A label-photo value is
            `uncertain` until the user confirms it (`user_confirmed`); an uncertain
            value must not be used in whole-package calculations (F2). `null` exactly
            when `source` is `null`.

    Package:
      type: object
      additionalProperties: false
      required: [quantity_text, quantity, unit, servings_per_package, source, certainty]
      properties:
        quantity_text:
          type: [string, "null"]
          description: Net quantity as listed, e.g. `"400 g"`.
        quantity:
          type: [number, "null"]
          exclusiveMinimum: 0
        unit:
          type: [string, "null"]
          enum: [g, ml, null]
        servings_per_package:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Only when a source states it. Never estimated by the backend.
        source:
          $ref: "#/components/schemas/SourceOrNull"
        certainty:
          type: [string, "null"]
          enum: [reported, confident, uncertain, user_confirmed, null]
          description: |
            Q1 critical field. `reported` for database values. A label-photo value is
            `uncertain` until the user confirms it (`user_confirmed`); an uncertain
            value must not be used in whole-package calculations (F2). `null` exactly
            when `source` is `null`.

    Nutrition:
      type: object
      additionalProperties: false
      required: [basis, nutrients]
      properties:
        basis:
          type: [string, "null"]
          enum: [serving, "100g", "100ml", null]
          description: |
            What every value in `nutrients` refers to. One basis per result; values
            from different bases are never mixed. `null` only when no nutrient is known.
        nutrients:
          type: object
          additionalProperties: false
          description: |
            Every key is always present; `null` means not available. Amounts are in
            each nutrient's canonical unit (kcal for calories, mg for sodium and
            cholesterol, g otherwise). A `0` amount means the source states zero.
          required:
            - calories
            - total_fat
            - saturated_fat
            - sodium
            - carbohydrate
            - sugars
            - fibre
            - protein
            - trans_fat
            - cholesterol
          properties:
            calories: {$ref: "#/components/schemas/NutrientValueOrNull"}
            total_fat: {$ref: "#/components/schemas/NutrientValueOrNull"}
            saturated_fat: {$ref: "#/components/schemas/NutrientValueOrNull"}
            sodium: {$ref: "#/components/schemas/NutrientValueOrNull"}
            carbohydrate: {$ref: "#/components/schemas/NutrientValueOrNull"}
            sugars: {$ref: "#/components/schemas/NutrientValueOrNull"}
            fibre: {$ref: "#/components/schemas/NutrientValueOrNull"}
            protein: {$ref: "#/components/schemas/NutrientValueOrNull"}
            trans_fat: {$ref: "#/components/schemas/NutrientValueOrNull"}
            cholesterol: {$ref: "#/components/schemas/NutrientValueOrNull"}

    NutrientValueOrNull:
      oneOf:
        - $ref: "#/components/schemas/NutrientValue"
        - type: "null"

    NutrientValue:
      type: object
      additionalProperties: false
      required: [amount, unit, daily_value_percent, source, certainty]
      properties:
        amount:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [kcal, g, mg]
        daily_value_percent:
          type: [number, "null"]
          minimum: 0
          description: |
            The %DV printed on the label, only from a label photo. Always `null` for
            Open Food Facts values. Calculated %DV (F3) is not carried here.
        source:
          $ref: "#/components/schemas/Source"
        certainty:
          type: string
          enum: [reported, confident, uncertain, user_confirmed]
          description: |
            `reported` for database values. `confident`, `uncertain` or
            `user_confirmed` for label-photo values (Q1). Photo values start as
            `uncertain` (the vision model gives no per-value confidence) and become
            `user_confirmed` once the user checks them. Uncertain values must not be
            explained or used in whole-package calculations.

    DataSource:
      type: object
      additionalProperties: false
      required: [provider, url, retrieved_at, last_modified_at]
      properties:
        provider:
          $ref: "#/components/schemas/Source"
        url:
          type: [string, "null"]
          format: uri
          description: Public page for the record, for a "View source" link.
        retrieved_at:
          type: string
          format: date-time
          description: When the backend fetched or read the data (UTC).
        last_modified_at:
          type: [string, "null"]
          format: date-time
          description: When the source record was last edited, if known (UTC).

    Source:
      type: string
      enum: [open_food_facts, nutrition_label_photo]

    SourceOrNull:
      description: "`null` exactly when every other value in the object is `null`."
      oneOf:
        - $ref: "#/components/schemas/Source"
        - type: "null"

    PackageNutritionResult:
      type: object
      additionalProperties: false
      description: |
        Per-serving and whole-package nutrition (#36, F2), from
        `backend/app/services/package_nutrition.py`. See package-nutrition.md.
        Not returned by an endpoint yet; #43 wires it into the analysis pipeline.
      required: [status, per_serving_label, whole_package_label, servings, display_servings,
        method, approximate, approximate_label, daily_value_label, reason, message,
        pending_confirmation, rows]
      properties:
        status:
          type: string
          enum: [calculated, not_calculated]
        per_serving_label:
          type: [string, "null"]
          description: For example "Per serving (2 tbsp (30 g))". `null` without per-serving nutrition.
        whole_package_label:
          type: [string, "null"]
          description: For example "Whole package (375 g)". `null` unless calculated.
        servings:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Unrounded servings in the package. `null` unless calculated.
        display_servings:
          type: [number, "null"]
          description: "`servings` rounded to 0.1, for display."
        method:
          type: [string, "null"]
          enum: [servings_per_package, package_quantity, null]
        approximate:
          type: boolean
          description: True when `method` is `package_quantity`.
        approximate_label:
          type: [string, "null"]
          enum: [Approximate, null]
        daily_value_label:
          type: [string, "null"]
          enum: [Calculated for whole package, null]
          description: |
            Shown once with the whole-package column when any row has a whole-package
            %DV (F2). `null` when no row has one.
        reason:
          type: [string, "null"]
          enum: [no_per_serving_nutrition, no_package_information, no_serving_quantity,
            incompatible_units, package_smaller_than_serving, unconfirmed_photo_values, null]
          description: Why nothing was calculated. `null` exactly when calculated.
        message:
          type: [string, "null"]
          description: F2's fixed message when not calculated, else `null`.
        pending_confirmation:
          type: array
          items:
            type: string
          description: Label-photo values (dotted paths) that wait for the user's confirmation (#39).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PackageNutrientRow"

    PackageNutrientRow:
      type: object
      additionalProperties: false
      required: [name, per_serving, whole_package, whole_package_status]
      properties:
        name:
          type: string
          enum: [calories, total_fat, saturated_fat, sodium, carbohydrate, sugars, fibre,
            protein, trans_fat, cholesterol]
        per_serving:
          $ref: "#/components/schemas/NutrientValueOrNull"
        whole_package:
          oneOf:
            - $ref: "#/components/schemas/WholePackageAmount"
            - type: "null"
        whole_package_status:
          type: string
          enum: [calculated, not_available, needs_confirmation]

    WholePackageAmount:
      type: object
      additionalProperties: false
      required: [amount, unit, display_amount, daily_value_percent, display_daily_value_percent]
      properties:
        amount:
          type: number
          minimum: 0
          description: Unrounded. Show `display_amount`.
        unit:
          type: string
          enum: [kcal, g, mg]
        display_amount:
          type: number
          minimum: 0
        daily_value_percent:
          type: [number, "null"]
          minimum: 0
          description: |
            Calculated from the whole-package amount with Health Canada's Daily Values,
            never scaled from a per-serving %DV. `null` where no Daily Value applies.
        display_daily_value_percent:
          type: [integer, "null"]
          minimum: 0

    NutrientExplanationResult:
      type: object
      additionalProperties: false
      description: |
        Per-serving %DV, Health Canada's 5% / 15% reading and plain-language
        explanations (#37, F3), from `backend/app/services/nutrient_explanations.py`.
        See nutrient-explanations.md. Not returned by an endpoint yet (#43).
      required: [basis, basis_label, basis_note, daily_values_reference, daily_value_definition,
        rows]
      properties:
        basis:
          type: [string, "null"]
          enum: [serving, 100g, 100ml, null]
        basis_label:
          type: [string, "null"]
          enum: [per serving, per 100 g, per 100 mL, null]
          description: Shown with every amount, so the basis is never ambiguous.
        basis_note:
          type: [string, "null"]
          description: |
            For per-100 g / 100 mL data only: explains that the amounts are not per
            serving and that no %DV is shown. `null` for per-serving data.
        daily_values_reference:
          type: object
          additionalProperties: false
          required: [title, url, version]
          properties:
            title: {type: string}
            url: {type: string, format: uri}
            version: {type: string}
        daily_value_definition:
          description: The %DV glossary text (#38). `null` until the content is reviewed.
          oneOf:
            - type: object
              additionalProperties: false
              required: [term, text, sources]
              properties:
                term: {type: string}
                text: {type: string}
                sources:
                  type: array
                  items: {$ref: "#/components/schemas/ExplanationSource"}
            - type: "null"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/NutrientExplanationRow"

    NutrientExplanationRow:
      type: object
      additionalProperties: false
      required: [name, display_name, guidance, value, status, status_text, daily_value,
        what_it_is, how_to_read, explanation_message]
      properties:
        name:
          type: string
          enum: [calories, total_fat, saturated_fat, sodium, carbohydrate, sugars, fibre,
            protein, trans_fat, cholesterol]
        display_name: {type: string}
        guidance:
          type: string
          enum: [limit, get_more, neutral]
          description: Whether Health Canada suggests getting less or more of it. Not a verdict.
        value:
          $ref: "#/components/schemas/NutrientValueOrNull"
        status:
          type: string
          enum: [verified, not_available, needs_confirmation]
        status_text:
          type: [string, "null"]
          description: '"Not available", or the confirmation prompt for an unconfirmed photo value.'
        daily_value:
          oneOf:
            - $ref: "#/components/schemas/PerServingDailyValue"
            - type: "null"
        what_it_is:
          oneOf:
            - $ref: "#/components/schemas/ExplanationText"
            - type: "null"
        how_to_read:
          oneOf:
            - $ref: "#/components/schemas/ExplanationText"
            - type: "null"
        explanation_message:
          type: [string, "null"]
          enum: [No verified explanation available yet., null]

    PerServingDailyValue:
      type: object
      additionalProperties: false
      required: [percent, display_percent, origin, label, interpretation, interpretation_text]
      properties:
        percent:
          type: number
          minimum: 0
        display_percent:
          type: integer
          minimum: 0
        origin:
          type: string
          enum: [label, calculated]
        label:
          type: [string, "null"]
          enum: [Calculated, null]
        interpretation:
          type: [string, "null"]
          enum: [a_little, a_lot, null]
          description: 5% DV or less is a little; 15% DV or more is a lot; otherwise `null`.
        interpretation_text:
          type: [string, "null"]
          enum: [a little, a lot, null]

    ExplanationText:
      type: object
      additionalProperties: false
      required: [text, sources]
      properties:
        text: {type: string}
        sources:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ExplanationSource"}

    ExplanationSource:
      type: object
      additionalProperties: false
      required: [id, publisher, title, url]
      properties:
        id: {type: string}
        publisher: {type: string}
        title: {type: string}
        url: {type: string, format: uri}

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_barcode, product_not_found, upstream_timeout, upstream_unavailable]
            message:
              type: string
              description: For logs and developers. The client shows its own wording.

    ConfirmationRequest:
      description: |
        The `result` and `product` of the photo `AnalysisResult` the client received,
        with checked label-photo values marked `user_confirmed`. Only values with
        `source: nutrition_label_photo` are read; each needs `certainty` `uncertain`
        or `user_confirmed`. A `product` result needs its `barcode`. (The server
        ignores any other top-level keys, such as `package_nutrition`.)
      type: object
      additionalProperties: false
      required: [result, product]
      properties:
        result:
          type: string
          enum: [product, nutrition_only]
        product:
          $ref: "#/components/schemas/Product"

    ConfirmationError:
      description: Error body of `/api/analysis/confirm` for a request it refuses.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_confirmation]
            message:
              type: string

    PhotoError:
      description: Error body of `/api/nutrition-label`. Same shape as `Error`, with its own codes.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - missing_image
                - invalid_image
                - file_too_large
                - image_too_large
                - unsupported_media_type
                - nutrition_table_not_found
                - upstream_unavailable
                - photo_reading_unavailable
                - upstream_timeout
            message:
              type: string
              description: For logs and developers. The client shows its own wording.

    AnalysisResult:
      description: |
        Product-analysis pipeline result (#43). The first four properties are the
        `ProductResult` contract unchanged; the rest are sections. A section that
        could not be computed is `null`, and the others are still returned.
      type: object
      additionalProperties: false
      required:
        - result
        - completeness
        - missing_fields
        - product
        - next_step
        - package_nutrition
        - explanations
        - ingredients
      properties:
        result:
          $ref: "#/components/schemas/ProductResult/properties/result"
        completeness:
          $ref: "#/components/schemas/ProductResult/properties/completeness"
        missing_fields:
          $ref: "#/components/schemas/ProductResult/properties/missing_fields"
        product:
          $ref: "#/components/schemas/Product"
        next_step:
          description: The routing decision (#15) for a barcode lookup; `null` for a photo result.
          oneOf:
            - $ref: "#/components/schemas/NextStep"
            - type: "null"
        package_nutrition:
          description: Per-serving and whole-package nutrition (#36, F2).
          oneOf:
            - $ref: "#/components/schemas/PackageNutritionResult"
            - type: "null"
        explanations:
          description: |
            Per-serving %DV and nutrient explanations (#37, F3). `null` if the reviewed
            nutrient content did not load.
          oneOf:
            - $ref: "#/components/schemas/NutrientExplanationResult"
            - type: "null"
        ingredients:
          description: Ingredient analysis (#33, F4). `null` if the knowledge base did not load.
          oneOf:
            - $ref: "#/components/schemas/IngredientAnalysisResult"
            - type: "null"

    NextStep:
      description: What the client does after a successful barcode lookup (#15).
      type: object
      additionalProperties: false
      required: [action, reason, product_identified, photo_fields, can_retry_lookup]
      properties:
        action:
          type: string
          enum: [use_database, request_nutrition_photo]
          description: |
            `request_nutrition_photo`: offer a Nutrition Facts photo to fill
            `photo_fields`, then call `POST /api/analysis/label-photo` with the barcode.
        reason:
          type: string
          enum: [complete, nutrition_missing, only_non_nutrition_missing]
        product_identified:
          type: boolean
        photo_fields:
          type: array
          description: The `missing_fields` paths the photo is expected to fill.
          items:
            type: string
        can_retry_lookup:
          type: boolean

  examples:
